netty.tcp-port=8090
netty.boss-count=1
netty.worker-count=10
netty.keep-alive=true
netty.backlog=100
# Enable only when every connection is preceded by an HAProxy PROXY protocol header.
netty.proxy-protocol-enabled=false
# Enable TLS with a PEM certificate chain and PKCS#8 or PKCS#1 PEM private key.
netty.tls.enabled=false
netty.tls.sni-enabled=false
netty.tls.certificate-chain=file:/path/to/default-cert.pem
netty.tls.private-key=file:/path/to/default-key.pem
